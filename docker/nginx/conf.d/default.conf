# Nginx vhost：本地 docker-compose 用
# K8s 部署时用 services/nginx/conf/nginx.conf，与本文件结构相同

server {
    listen 80 default_server;
    server_name _;

    # 健康检查端点
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # PHP 请求转发到 PHP-FPM
    location / {
        root /var/www/html/public;
        index index.php;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass php:9000;          # docker-compose 中 service 名
        # K8s 中应改为 php:9000（同 namespace 短名）
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}