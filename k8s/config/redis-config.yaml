# Redis ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: cfa
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    daemonize no
    loglevel notice
    dir /data
    appendonly yes
    appendfsync everysec
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    protected-mode no