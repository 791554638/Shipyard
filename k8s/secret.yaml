# Secret：所有敏感信息（密码、token 等）
#
# ⚠️ 警告：以下密码仅用于本地学习，明文写在仓库里
#   生产环境必须使用：
#     1. Sealed Secrets / External Secrets / Vault
#     2. CI 注入
#     3. 绝不能把真实密码提交到 git
#
# ELK 8.x 安全特性：
#   - 首次启动 ES 时设置 ELASTIC_PASSWORD 环境变量，会自动 bootstrap elastic 用户
#   - Kibana / Logstash 用 elastic 账户连接（学习用最简方案；生产推荐专用账户）

apiVersion: v1
kind: Secret
metadata:
  name: cfa-secret
  namespace: cfa
type: Opaque
stringData:
  # MySQL
  MYSQL_ROOT_PASSWORD: "rootpass"
  MYSQL_PASSWORD: "cfapass"
  # ELK（elastic 用户首次启动时由 ES 自动 bootstrap）
  ELASTIC_PASSWORD: "Cfa@Elastic2026"
