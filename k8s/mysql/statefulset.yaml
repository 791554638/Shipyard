# MySQL：有状态服务，使用 StatefulSet + volumeClaimTemplates
#
# 关键点：
#   1. StatefulSet 提供稳定的网络标识（mysql-0）和持久化存储
#   2. 密码通过 env 从 Secret 注入（不在镜像里写死）
#   3. init.sql 用 initContainer 在首次启动时执行
#   4. Service 用 ClusterIP，无头服务由 StatefulSet 自动创建
#
# 学习要点：为什么不用 Deployment？
#   Deployment 的 Pod 是"无差别"的，重启后数据卷可能挂到别的 Pod
#   StatefulSet 给每个 Pod 固定的 hostname 和 PVC 绑定

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: cfa
spec:
  clusterIP: None  # Headless Service，由 StatefulSet 自动管理
  selector:
    app: mysql
  ports:
    - port: 3306
      name: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: cfa
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      initContainers:
        # 首次启动时执行 init.sql 建库建表
        - name: init-db
          image: mysql:8.0
          command: ["bash", "-c"]
          args:
            - |
              # 仅当 /var/lib/mysql 为空（即首次启动）时执行初始化
              if [ ! -d /var/lib/mysql/mysql ]; then
                echo "[init-db] First start, running init.sql"
                mysql -uroot -p"$MYSQL_ROOT_PASSWORD" < /docker-entrypoint-initdb.d/init.sql || true
              else
                echo "[init-db] Data dir already initialized, skip"
              fi
          envFrom:
            - secretRef:
                name: cfa-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cfa-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "cfa"
            - name: MYSQL_USER
              value: "cfa"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cfa-secret
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: mysql-config
            items:
              - key: my.cnf
                path: my.cnf
        - name: init-sql
          configMap:
            name: mysql-config
            items:
              - key: init.sql
                path: init.sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ""   # 用集群默认 StorageClass
        resources:
          requests:
            storage: 8Gi
