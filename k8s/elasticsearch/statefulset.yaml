# Elasticsearch：有状态服务 + initContainer 安装 IK 分词器
#
# 安全特性：
#   - ELASTIC_PASSWORD 由 Secret 注入，首次启动自动 bootstrap elastic 用户
#   - xpack.security.enabled: true（HTTP + 用户名密码）
#   - xpack.security.http.ssl.enabled: false（学习用关掉 SSL）
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: cfa
spec:
  clusterIP: None
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      name: http
    - port: 9300
      name: transport
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: cfa
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      initContainers:
        - name: install-ik
          # busybox 无 curl 且其 wget 的 TLS 栈过老（与现代 CDN 握手失败），
          # 改用自带 curl + unzip 的官方镜像
          image: curlimages/curl:8.11.0
          securityContext:
            runAsUser: 0   # 需写 emptyDir
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo "[init] Downloading IK 8.11.0 ..."
              curl -fsSL -o /tmp/ik.zip \
                https://get.infini.cloud/elasticsearch/analysis-ik/8.11.0
              mkdir -p /ik-target
              unzip -q /tmp/ik.zip -d /ik-target
              echo "[init] IK installed:"
              ls -la /ik-target
          volumeMounts:
            - name: ik-shared
              mountPath: /ik-target
      containers:
        - name: elasticsearch
          image: elasticsearch:8.11.0
          imagePullPolicy: IfNotPresent
          env:
            - name: discovery.type
              value: "single-node"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            # 自动 bootstrap elastic 用户密码（首次启动时）
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cfa-secret
                  key: ELASTIC_PASSWORD
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            # ⚠️ 必须用 subPath 挂单文件：整目录挂载 ConfigMap 是只读的，
            # ES 启动要往 config/ 写 keystore，整目录挂载会 CrashLoop
            # （Read-only file system）
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
            - name: ik-shared
              mountPath: /usr/share/elasticsearch/plugins/analysis-ik
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          # ⚠️ 开启 xpack security 后 httpGet 探针必 401（probe 无法携带认证），
          # 改用 exec 探针：容器内 curl + 环境变量注入的密码（ES 镜像自带 curl）
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -sf -u "elastic:$ELASTIC_PASSWORD" localhost:9200/_cluster/health
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -sf -u "elastic:$ELASTIC_PASSWORD" localhost:9200/_cluster/health
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: es-config
            items:
              - key: elasticsearch.yml
                path: elasticsearch.yml
        - name: ik-shared
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # 省略 storageClassName = 用集群默认 SC（勿写 ""，那会禁用动态供给导致 Pending）
        resources:
          requests:
            storage: 30Gi
