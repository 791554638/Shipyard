# Nginx：无状态，反向代理 + 静态资源
#
# 镜像 tag 由 scripts/dev-deploy.sh 通过 Kustomize 注入（sha tag），
# 本文件保持基线引用（cfa/nginx:1.25），不要手动改这里换版本。

---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: cfa
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: cfa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: cfa/nginx:1.25   # 自定义镜像，需先构建：docker build -t cfa/nginx:1.25 -f docker/nginx/Dockerfile .
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config-main
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: config-vhost
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            # 应用代码在 php 镜像内（docker/app/Dockerfile COPY app/），
            # 由 PHP-FPM 按SCRIPT_FILENAME 解析，nginx 无需挂代码卷。
            # 静态文件若不存在会由 try_files 回落 index.php（学习项目可接受）。
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config-main
          configMap:
            name: nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: config-vhost
          configMap:
            name: nginx-config
            items:
              - key: default.conf
                path: default.conf
