---
name: Lint

# 注意：YAML 1.1 中裸写 on 会被解析为布尔 true，加引号消除 yamllint truthy 警告
"on":
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  yaml-lint:
    name: YAML syntax & style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install --quiet yamllint==1.37.1

      - name: Run yamllint
        run: |
          # 放宽：不限行长度、不强制文档起始 ---（避免噪音）
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, comments-indentation: disable}}" \
            k8s/ services/ docker/ .github/ docker-compose.yml

  shell-lint:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck
        run: find scripts -type f -name "*.sh" -exec shellcheck --severity=warning --exclude=SC1091 {} +

  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install hadolint
        run: |
          wget -q -O /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: Run hadolint
        run: hadolint docker/app/Dockerfile docker/nginx/Dockerfile

  # ============================================================
  # CI 增强：Docker 镜像构建验证（只构建不推送）
  # 防止 Dockerfile 改动后镜像构建失败却没被发现
  # ============================================================
  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PHP-FPM image
        run: docker build -t cfa/php:ci -f docker/app/Dockerfile .

      - name: Build Nginx image
        run: docker build -t cfa/nginx:ci docker/nginx

  # ============================================================
  # CI 增强：K8s manifest 客户端 dry-run 校验
  # 不连接真实集群，仅做 schema/字段合法性检查
  # ============================================================
  k8s-dry-run:
    name: K8s manifest dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          KUBE_VER=$(curl -sL https://dl.k8s.io/release/stable.txt)
          curl -sLO "https://dl.k8s.io/release/${KUBE_VER}/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Validate manifests (client dry-run)
        run: kubectl apply -f k8s/ -R --dry-run=client
