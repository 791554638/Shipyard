---
name: Lint

# 注意：YAML 1.1 中裸写 on 会被解析为布尔 true，加引号消除 yamllint truthy 警告
"on":
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  yaml-lint:
    name: YAML syntax & style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install --quiet yamllint==1.37.1

      - name: Run yamllint
        run: |
          # 放宽：不限行长度、不强制文档起始 ---（避免噪音）
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, comments-indentation: disable}}" \
            k8s/ services/ docker/ .github/ docker-compose.yml

  shell-lint:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck
        run: find scripts -type f -name "*.sh" -exec shellcheck --severity=warning --exclude=SC1091 {} +

  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install hadolint
        run: |
          wget -q -O /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: Run hadolint
        run: hadolint docker/app/Dockerfile docker/nginx/Dockerfile

  # ============================================================
  # CI 增强：Docker 镜像构建验证（只构建不推送）
  # 防止 Dockerfile 改动后镜像构建失败却没被发现
  # ============================================================
  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PHP-FPM image
        run: docker build -t cfa/php:ci -f docker/app/Dockerfile .

      - name: Build Nginx image
        run: docker build -t cfa/nginx:ci docker/nginx

  # ============================================================
  # CI 增强：K8s manifest schema 校验
  # 注：kubectl apply --dry-run=client 在无 API server 时仍会尝试
  # 下载 OpenAPI schema 导致失败（--validate=false 则几乎不校验），
  # 故改用 kubeconform 做离线 schema 校验（CI 界标准做法）
  # ============================================================
  k8s-dry-run:
    name: K8s manifest schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate manifests against K8s schema
        run: kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0 k8s/

  # ============================================================
  # v0.4.0 CI 参数注入：Secret 模板渲染 + 校验（dry-run）
  # 原理：GitHub Secrets 以 env 进入 job → envsubst 渲染到内存
  #       → kubeconform stdin 校验。密码全程不落盘、不打印。
  # 前置：仓库 Settings → Secrets → Actions 配置
  #       MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD / ELASTIC_PASSWORD
  # ============================================================
  secret-render:
    name: Secret template render (dry-run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Render & validate secret template
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          ELASTIC_PASSWORD: ${{ secrets.ELASTIC_PASSWORD }}
        run: |
          set -euo pipefail
          # 1. 空值检查：Secret 未配置/名字写错 → 立即失败
          #    （只报变量名，绝不打印值）
          missing=0
          for var in MYSQL_ROOT_PASSWORD MYSQL_PASSWORD ELASTIC_PASSWORD; do
            if [ -z "$(printenv "$var")" ]; then
              echo "::error::Secret '$var' 为空 —— 未配置或名字不匹配（Settings → Secrets → Actions）"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # 2. 渲染到内存变量（不写文件）
          RENDERED=$(envsubst < k8s/secret.yaml.tpl)

          # 3. 兜底检查：占位符必须全部被替换
          if printf '%s' "$RENDERED" | grep -qE '\$\{[A-Z_]+\}'; then
            echo "::error::占位符未被替换，检查模板与 secrets 名称"
            exit 1
          fi

          # 4. 渲染结果必须是合法 K8s manifest（stdin 校验，不落盘）
          printf '%s' "$RENDERED" | kubeconform -strict -summary -ignore-missing-schemas -
          echo "✅ 模板渲染 + 校验通过（密码未落盘、未打印）"

  # ============================================================
  # 防泄漏守卫：
  #   1) .env 不得被 git 跟踪
  #   2) 全仓扫描：学习默认密码不得出现在任何被跟踪文件
  #      白名单 = .env.example（默认值唯一来源）/ 密钥方案文档 / 本守卫自身
  #   3) .env.example 与 secret.yaml.tpl 变量名一致（防漂移）
  # ============================================================
  secret-leak-guard:
    name: Secret leak guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against secret leaks
        run: |
          # 1) .env 不应出现在 git 跟踪列表
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env 被提交了！请 git rm --cached .env"
            exit 1
          fi
          # 2) 全仓扫描学习默认密码（git grep 仅查被跟踪文件，白名单除外）
          LEAKS=$(git grep -nE 'rootpass|cfapass|Cfa@' \
              -- ':!.env.example' ':!docs/secrets-management.md' ':!.github/workflows/lint.yml' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::学习默认密码出现在非白名单文件（默认值唯一来源是 .env.example）："
            echo "$LEAKS"
            exit 1
          fi
          # 3) .env.example 的键与模板占位符必须一一对应
          diff <(grep -oE '^[A-Z_]+=' .env.example | tr -d '=' | sort) \
               <(grep -oE '\$\{[A-Z_]+\}' k8s/secret.yaml.tpl | tr -d '${}' | sort) \
            || { echo "::error::.env.example 与 secret.yaml.tpl 变量名漂移，需同步修改"; exit 1; }
          echo "✅ 无泄漏：.env 未跟踪 / 全仓无明文默认密码 / 模板变量一致"
