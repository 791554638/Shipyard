; 本地研发模式覆盖配置（仅 docker-compose 挂载到 conf.d/zz-dev.ini，K8s 不使用）
;
; php.ini 中 opcache.validate_timestamps=0 是生产配置（永不重读文件），
; 研发模式改为每次请求都校验时间戳：改代码即时生效，无需重启容器。
; conf.d/*.ini 在 php.ini 之后加载，同名指令后者覆盖前者。

; 研发模式屏蔽 PHP 8.2 对旧框架（Laravel 5.5 vendor 不可改）的废弃警告，
; 避免污染页面输出；真实错误（E_ERROR 等）仍然显示。
[PHP]
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING

[opcache]
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
