# Redis 7 配置
# 容器内路径：/usr/local/etc/redis/redis.conf

# 绑定所有网卡（容器内）
bind 0.0.0.0

# 端口
port 6379

# 守护进程（容器内必须关闭）
daemonize no

# 日志级别
loglevel notice

# 工作目录
dir /data

# 持久化
appendonly yes
appendfsync everysec

# 内存管理
maxmemory 256mb
maxmemory-policy allkeys-lru

# 关闭保护模式（容器内网安全）
protected-mode no